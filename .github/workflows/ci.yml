# CPU-only: nothing here touches a GPU (the GPU integration test is skipped).
#
# Every run uploads the wheel and sdist, and the dashboard as
# giq-ui-<version>.tar.gz, as workflow artifacts. A tag v<version> also
# publishes them on the GitHub Release of that tag with a SHA256SUMS, which is
# what `deploy/install-debian.sh --ui-release` downloads and checks: a Debian
# server's Node.js is too old to build the dashboard itself.
name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  # By hand: re-running a release's build, and a start GitHub has to answer —
  # when Actions is blocked a dispatch returns the reason, a push returns
  # nothing.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      # pyproject.toml is the one place the version is written; a tag has to
      # agree with it, or the release would carry files named for another one.
      - name: Version
        id: version
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          echo "version=$version" >>"$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match pyproject.toml's version $version (expected v$version)"
            exit 1
          fi
          echo "giq $version"

      # --- dashboard -------------------------------------------------------
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Typecheck
        working-directory: frontend
        run: npx tsc --noEmit
      - name: Frontend tests
        working-directory: frontend
        run: npm test
      - name: Build the dashboard
        working-directory: frontend
        run: npm run build

      # --- service ---------------------------------------------------------
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      # The service process never imports the ML stack — torch, transformers,
      # faster-whisper and friends load only inside the worker children — so
      # the tests run in a lean environment instead of pulling several GB of
      # CUDA wheels onto a CPU runner: core with its own dependencies, and the
      # curated plugins without theirs. A test that starts needing one of
      # those packages fails here with ImportError, which is the point.
      - name: Test environment (without the ML stack)
        run: |
          uv venv --python 3.12
          uv pip install -e . pillow numpy pypdfium2 pytest pytest-asyncio ruff
          uv pip install --no-deps -e plugins/giq-vllm -e plugins/giq-sdcpp \
            -e plugins/giq-speech -e plugins/giq-ocr -e plugins/giq-depth
      - name: Tests (CPU)
        run: .venv/bin/python -m pytest -q --ignore=tests/test_dirty_workers_integration.py
      - name: Lint
        run: .venv/bin/ruff check src tests plugins && .venv/bin/ruff format --check src tests plugins
      - name: REUSE
        run: uvx reuse lint

      # --- package ---------------------------------------------------------
      # Core, each curated plugin and giq-defaults, released together.
      - name: Build the wheels
        run: uv build --all-packages
      - name: The wheel carries the dashboard
        run: |
          python3 - <<'PY'
          import glob, sys, zipfile
          wheel = glob.glob("dist/giq-[0-9]*.whl")[0]
          names = zipfile.ZipFile(wheel).namelist()
          if "giq/static/ui/index.html" not in names:
              sys.exit(f"{wheel} has no giq/static/ui/index.html — the built UI was left out")
          if not any(n.startswith("giq/static/ui/assets/") for n in names):
              sys.exit(f"{wheel} has no giq/static/ui/assets/")
          # MIT and OFL-1.1 require their text to travel with every copy of
          # the bundled React, i18next, Phosphor and Inter code.
          notices = "giq/static/ui/THIRD_PARTY_LICENSES.txt"
          if notices not in names:
              sys.exit(f"{wheel} has no {notices}")
          text = zipfile.ZipFile(wheel).read(notices).decode()
          for needle in ("react@", "OFL"):
              if needle not in text:
                  sys.exit(f"{notices} does not mention {needle!r}")
          print(f"{wheel}: dashboard and its third-party licences included")
          PY

      # --- distribution ----------------------------------------------------
      - name: Pack the dashboard
        run: make ui-pack
      - name: Installer (shellcheck, and the dashboard install from the tarball)
        run: |
          shellcheck deploy/install-debian.sh tests/deploy/test-ui-install.sh
          tests/deploy/test-ui-install.sh "dist/giq-ui-${{ steps.version.outputs.version }}.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: giq-${{ steps.version.outputs.version }}-python
          path: |
            dist/giq-${{ steps.version.outputs.version }}-*.whl
            dist/giq-${{ steps.version.outputs.version }}.tar.gz
            dist/giq_*-${{ steps.version.outputs.version }}-*.whl
            dist/giq_*-${{ steps.version.outputs.version }}.tar.gz
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: giq-ui-${{ steps.version.outputs.version }}
          path: dist/giq-ui-${{ steps.version.outputs.version }}.tar.gz
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.build-and-test.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: giq-*
          path: dist
          merge-multiple: true
      - name: SHA256SUMS
        working-directory: dist
        run: |
          for f in "giq-$VERSION-py3-none-any.whl" "giq-$VERSION.tar.gz" "giq-ui-$VERSION.tar.gz" \
                   giq_{vllm,sdcpp,speech,ocr,depth,defaults}-"$VERSION"-py3-none-any.whl; do
            [ -f "$f" ] || { echo "::error::$f is missing from the build's artifacts"; exit 1; }
          done
          sha256sum -- *.whl *.tar.gz >SHA256SUMS
          cat SHA256SUMS
      # Creates the release for the tag, or adds to (and replaces same-named
      # files on) one that exists, so re-running the job is harmless.
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS
          fail_on_unmatched_files: true
