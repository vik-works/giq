version = 1

# NOTICE is reproduced verbatim by redistributors (Apache-2.0, section 4(d)),
# so it carries no SPDX header of its own.
[[annotations]]
path = "NOTICE"
SPDX-FileCopyrightText = "2026 vikworks UG (haftungsbeschränkt)"
SPDX-License-Identifier = "Apache-2.0"

# Generated by uv and rewritten on every lock; no room for a header.
[[annotations]]
path = ["uv.lock", "envs/*/uv.lock"]
SPDX-FileCopyrightText = "2026 vikworks UG (haftungsbeschränkt)"
SPDX-License-Identifier = "Apache-2.0"

# JSON has no comment syntax. The dashboard's manifests (package-lock.json is
# rewritten by npm on every install) and its translation files.
[[annotations]]
path = [
  "frontend/package.json",
  "frontend/package-lock.json",
  "frontend/tsconfig.json",
  "frontend/src/locales/**/*.json",
  "frontend/plugins/*/public/**/*.json",
]
SPDX-FileCopyrightText = "2026 vikworks UG (haftungsbeschränkt)"
SPDX-License-Identifier = "Apache-2.0"

# Screenshots of the dashboard (rendered from mocked data) in the README and docs.
[[annotations]]
path = "docs/images/*.png"
SPDX-FileCopyrightText = "2026 vikworks UG (haftungsbeschränkt)"
SPDX-License-Identifier = "Apache-2.0"

# One line read by uv; no room for a header.
[[annotations]]
path = ".python-version"
SPDX-FileCopyrightText = "2026 vikworks UG (haftungsbeschränkt)"
SPDX-License-Identifier = "Apache-2.0"
