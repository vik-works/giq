[project]
name = "giq-env-stable-audio"
version = "0.1.0"
description = "Interpreter for giq's Stable Audio 3 child (text to music and sound)"
requires-python = ">=3.11,<3.12"
dependencies = [
    # Not on PyPI, so pinned to a commit. stable-audio-3 pins torch 2.7.1 and
    # needs transformers 5, which is why it gets an interpreter of its own.
    # Without flash-attn its attention falls back to PyTorch's SDPA.
    "stable-audio-3 @ git+https://github.com/Stability-AI/stable-audio-3@790793b89ddceea612be9ce42ff6830d18f6fa57",
]

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
# torch 2.7.1 runs on Blackwell cards (sm_120) only in its CUDA 12.8 build;
# stable-audio-3 sends torch to the cu126 index through its own uv sources,
# which an index of ours would conflict with. So the same versions it pins,
# as the cu128 wheels themselves.
override-dependencies = [
    "torch @ https://download.pytorch.org/whl/cu128/torch-2.7.1%2Bcu128-cp311-cp311-manylinux_2_28_x86_64.whl",
    "torchaudio @ https://download.pytorch.org/whl/cu128/torchaudio-2.7.1%2Bcu128-cp311-cp311-manylinux_2_28_x86_64.whl",
]
