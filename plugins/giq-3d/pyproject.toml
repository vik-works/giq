[project]
name = "giq-3d"
version = "0.11.0"
description = "Image to textured 3D mesh for giq (Pixal3D)"
license = "Apache-2.0"
license-files = ["LICENSES/*.txt"]
authors = [{ name = "vikworks UG (haftungsbeschränkt)" }]
requires-python = ">=3.11,<3.13"
dependencies = [
    "giq==0.11.0",
]

[project.entry-points."giq.plugins"]
giq-3d = "giq_3d:plugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/giq_3d", "src/giq_3d_child"]
