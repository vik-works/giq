# Pixal3D's multi-view checkpoints (MIT; the `*_mv` files of the same
# repository as `pixal3d`): four views a quarter turn apart round an object
# in, a textured mesh with PBR materials out. The cameras are the rig the
# model ships, so nothing is estimated, and the mesh comes out in the rig's
# frame: upright and squared to the axes, with the sides the views show
# where a single picture leaves them to be guessed. Sleepy model: loads on
# demand, evictable.
#
# The parts and their terms are `pixal3d`'s; see that recipe. The camera
# estimator is listed because the engine checks for it at start, though
# this recipe never runs it.
name: pixal3d-mv
label: Pixal3D multi-view
modalities: [image2mesh]
engine: pixal3d
detail: "four views → textured mesh · upright · PBR · GLB · full detail or game-ready low-poly"
weights:
  path: TencentARC-Pixal3D
  source: hf:TencentARC/Pixal3D
  revision: b0cb2e1b794cab9aa0ac38a95d794a4d9337437f
  format: safetensors
  licence: mit
  parts:
    encoder:
      path: timm-vit_large_patch16_dinov3_qkvb.lvd1689m
      source: hf:timm/vit_large_patch16_dinov3_qkvb.lvd1689m
      revision: 3653d393df9fd16a9c1bae8a6c5a514f683b70ce
      format: safetensors
      licence: dinov3-license
    camera:
      path: Ruicheng-moge-2-vitl
      source: hf:Ruicheng/moge-2-vitl
      revision: 39c4d5e957afe587e04eec59dc2bcc3be5ecd968
      licence: mit
    matting:
      path: ZhengPeng7-BiRefNet
      source: hf:ZhengPeng7/BiRefNet
      revision: e2bf8e4460fc8fa32bba5ea4d94b3233d367b0e4
      licence: mit
params:
  resolution: 1024
  low_vram: true
  views: multi
vram:
  # Measured on an RTX 5090, the child's own peak: 17,724 and 18,434 MiB for
  # two objects at 1024 in low-VRAM mode, four views each. 83 s for a
  # game-ready asset once warm.
  gb: 18.5
  measured: true
# One asset per task; a batch generates them one after another.
max_batch: 2
