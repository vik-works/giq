# TRELLIS.2-4B (Microsoft, MIT; https://huggingface.co/microsoft/TRELLIS.2-4B):
# one image in, a textured mesh with PBR materials out. The backbone Pixal3D
# is built on, and unlike it not tied to the picture's pose: it stands the
# object upright and squared to the axes in a frame of its own, and fills in
# the far sides plausibly, at some cost in likeness. Tried on one prop next
# to `pixal3d`: upright where that one leaned with its picture, the surface
# further from the concept. Sleepy model: loads on demand, evictable.
#
# It runs in the pixal3d engine's environment, from its own checkout, with
# the same substitutions (giq's rasteriser for nvdiffrast, BiRefNet for
# RMBG-2.0, timm's DINOv3 for Meta's gated one). Its parts and their terms
# are `pixal3d`'s, less the camera estimator it does not use, plus:
#   structure  TRELLIS-image-large (MIT), the first TRELLIS, whose sparse
#              structure decoder TRELLIS.2's pipeline loads by name.
name: trellis2
label: TRELLIS.2
modalities: [image2mesh]
engine: pixal3d
detail: "image → textured mesh · upright · PBR · GLB · full detail or game-ready low-poly"
weights:
  path: microsoft-TRELLIS.2-4B
  source: hf:microsoft/TRELLIS.2-4B
  revision: af44b45f2e35a493886929c6d786e563ec68364d
  format: safetensors
  licence: mit
  parts:
    encoder:
      path: timm-vit_large_patch16_dinov3_qkvb.lvd1689m
      source: hf:timm/vit_large_patch16_dinov3_qkvb.lvd1689m
      revision: 3653d393df9fd16a9c1bae8a6c5a514f683b70ce
      format: safetensors
      licence: dinov3-license
    matting:
      path: ZhengPeng7-BiRefNet
      source: hf:ZhengPeng7/BiRefNet
      revision: e2bf8e4460fc8fa32bba5ea4d94b3233d367b0e4
      licence: mit
    structure:
      path: microsoft-TRELLIS-image-large
      source: hf:microsoft/TRELLIS-image-large
      revision: 25e0d31ffbebe4b5a97464dd851910efc3002d96
      format: safetensors
      licence: mit
params:
  pipeline: trellis2
  resolution: 1024
  low_vram: true
vram:
  # Measured on an RTX 5090, the child's own peak at 1024 in low-VRAM mode:
  # 13,220 MiB for a crate with a game-ready export, 6,900 MiB for a cannon
  # with a full one. The object decides: the cascade's token count follows
  # its surface. 45-85 s to generate; about 55 s to load.
  gb: 13.5
  measured: true
# One asset per task; a batch generates them one after another.
max_batch: 2
