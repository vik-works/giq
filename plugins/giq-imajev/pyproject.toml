[project]
name = "giq-imajev"
version = "0.6.0"
description = "Typed photo+record decisions for giq (imajev)"
license = "Apache-2.0"
authors = [{ name = "vikworks UG (haftungsbeschränkt)" }]
requires-python = ">=3.11,<3.13"
dependencies = [
    "giq==0.6.0",
]

[project.entry-points."giq.plugins"]
giq-imajev = "giq_imajev:plugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/giq_imajev", "src/giq_imajev_child"]
