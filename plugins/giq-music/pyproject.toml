[project]
name = "giq-music"
version = "0.7.0"
description = "Text to music for giq (ACE-Step 1.5)"
license = "Apache-2.0"
license-files = ["LICENSES/*.txt"]
authors = [{ name = "vikworks UG (haftungsbeschränkt)" }]
requires-python = ">=3.11,<3.13"
dependencies = [
    "giq==0.7.0",
]

[project.entry-points."giq.plugins"]
giq-music = "giq_music:plugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/giq_music", "src/giq_music_child"]
