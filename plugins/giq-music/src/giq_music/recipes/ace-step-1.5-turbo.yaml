# ACE-Step 1.5 turbo (MIT; https://huggingface.co/ACE-Step/Ace-Step1.5): a
# 2B DiT that renders 10 s to 10 min of 48 kHz stereo music in 8 steps,
# planned by a 5Hz LM (fine-tuned Qwen3-1.7B) that fills in what a request
# leaves open — tempo, key, time signature, duration, the song's structure —
# and conditioned through Qwen3-Embedding-0.6B (Apache-2.0). Lyrics in 50+
# languages; the card allows commercial use of the output. Sleepy model:
# loads on demand, evictable.
#
# The repository is ACE-Step's own checkpoint layout (acestep-v15-turbo/,
# acestep-5Hz-lm-1.7B/, Qwen3-Embedding-0.6B/, vae/), 10.1 GB; params name
# the folders the child loads.
name: ace-step-1.5-turbo
label: ACE-Step 1.5 Turbo
modalities: [text2music]
engine: acestep
detail: "text → music · lyrics · 10 s–10 min · 48 kHz stereo"
weights:
  path: ACE-Step-Ace-Step1.5
  source: hf:ACE-Step/Ace-Step1.5
  revision: 19671f406d603126926c1b7e2adc169acbcade22
  format: safetensors
  licence: mit
params:
  dit: acestep-v15-turbo
  lm: acestep-5Hz-lm-1.7B
  steps: 8
vram:
  # Measured on an RTX 5090, the child's own peak: 14,310 MiB for a 30 s
  # track and 14,238 MiB for 10 min, both planned. The track's length hardly
  # matters: the planner's nano-vllm claims a fixed 4.7 GB (weights + 4k KV
  # cache) on top of the DiT, VAE and text encoder, less only on a card that
  # lacks it. 2.7 s per 30 s track and 22 s per 10 min, warm; ~40 s to load.
  gb: 14.5
  measured: true
# One track per task; a batch renders them one after another.
max_batch: 4
