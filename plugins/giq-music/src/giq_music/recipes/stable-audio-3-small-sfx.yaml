# Stable Audio 3 Small SFX (Stability AI Community License;
# https://huggingface.co/stabilityai/stable-audio-3-small-sfx): a 433M DiT
# over the SAME-S autoencoder, conditioned through T5Gemma (Gemma terms),
# that renders up to 120 s of 44.1 kHz stereo sound effects and ambience in 8 steps.
# Light enough for a small card next to resident models. The Community
# License allows commercial use below USD 1M annual revenue. The repository
# is gated: accept its terms on Hugging Face before fetching. Sleepy model:
# loads on demand, evictable.
name: stable-audio-3-small-sfx
label: Stable Audio 3 Small SFX
modalities: [text2sfx]
engine: stable-audio
detail: "text → sound effects · up to 2 min · 44.1 kHz stereo"
weights:
  path: stabilityai-stable-audio-3-small-sfx
  source: hf:stabilityai/stable-audio-3-small-sfx
  revision: 05ca3857881c94a2b84026b1111c537d78f5f9f0
  format: safetensors
  licence: stability-ai-community
params:
  steps: 8
  max_seconds: 120
  default_seconds: 10
vram:
  # Not measured here. Stability reports a 2.4 GB peak allocation on an H200
  # for a 120 s track; this adds the CUDA context and allocator slack.
  gb: 4.0
  measured: false
max_batch: 4
