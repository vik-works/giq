[project]
name = "giq-rig"
version = "0.11.0"
description = "A 3D mesh skinned to a skeleton for giq (SkinTokens)"
license = "Apache-2.0"
license-files = ["LICENSES/*.txt"]
authors = [{ name = "vikworks UG (haftungsbeschränkt)" }]
requires-python = ">=3.11,<3.13"
dependencies = [
    "giq==0.11.0",
]

[project.entry-points."giq.plugins"]
giq-rig = "giq_rig:plugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/giq_rig", "src/giq_rig_child"]
