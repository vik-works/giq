# SkinTokens (Zhang et al., arXiv:2602.04805; code and weights MIT;
# https://huggingface.co/VAST-AI/SkinTokens): a mesh in, the same mesh
# skinned to a skeleton out. TokenRig, a transformer of Qwen3-0.6B's shape,
# generates the skeleton and the skin weights as one token sequence; the
# skin weights are tokens of a learned codebook, the FSQ-CVAE the
# repository also holds. Sleepy model: loads on demand, evictable.
#
# What it was trained on: ArticulationXL 2.0, rigged models curated from
# Objaverse; character models from VRoid Hub; and models from
# The Models Resource, which collects models extracted from commercial
# games. The MIT licence on the weights is VAST-AI's grant and says nothing
# about the terms of those assets.
#
# What it needs besides its own weights:
#   llm  Qwen3-0.6B's config.json (Apache-2.0), the transformer's
#        architecture. Only the file: TokenRig's own checkpoint holds all
#        of its weights, so Qwen's are never fetched.
# Its code is a checkout `giq prepare skintokens` fetches; part of it is
# under GPL-3.0 (docs/engines.md).
#
# The checkpoints are pickled training states (torch.load with
# weights_only=False), which run code as they load: they come from the
# pinned revision below, and from nowhere else.
name: skintokens
label: SkinTokens
modalities: [mesh2rig]
engine: skintokens
detail: "mesh → skeleton + skin weights · GLB · the mesh and its textures kept"
weights:
  path: VAST-AI-SkinTokens
  source: hf:VAST-AI/SkinTokens
  revision: 79736cad0fd84de384d5eede659b4ebd24effe33
  licence: mit
  parts:
    llm:
      path: Qwen-Qwen3-0.6B/config.json
      source: hf:Qwen/Qwen3-0.6B/config.json
      revision: c1899de289a04d12100db370d81485cdf75e47ca
      licence: apache-2.0
vram:
  # Measured through the queue, the child's own peak: 4,248 MiB on an RTX
  # 5090 and 3,770 MiB on an RTX 5060 Ti, over game characters of 3-4k
  # vertices, a 15k-vertex giraffe and a batch of three. A rig takes 5-9 s
  # warm on the 5090 and 11-16 s on the 5060 Ti; a cold start, the load
  # included, about 30 s on either.
  gb: 4.5
  measured: true
# One mesh per task; a batch rigs them one after another.
max_batch: 4
