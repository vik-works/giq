[project]
name = "giq-sdcpp"
version = "0.6.1"
description = "stable-diffusion.cpp for giq: image generation and editing"
license = "Apache-2.0"
authors = [{ name = "vikworks UG (haftungsbeschränkt)" }]
requires-python = ">=3.11,<3.13"
dependencies = [
    "giq==0.6.1",
]

[project.entry-points."giq.plugins"]
giq-sdcpp = "giq_sdcpp:plugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/giq_sdcpp"]
