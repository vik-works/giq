# Qwen-Image-Edit-2511 (20B MMDiT, Apache-2.0), under sd.cpp, with the
# 4-step Lightning LoRA. The newest Qwen edit model with open weights under
# a commercial licence: Qwen-Image-2.1 is newer, but under the Qwen Research
# License (non-commercial), so it is not a built-in recipe.
#
# Every part is quantised GGUF because --offload-to-cpu holds all of them in
# RAM between phases: Q6_K (17.9 GB) plus the Q8_0 encoder and its vision
# tower come to ~28 GB of RAM. The fp8 ComfyUI files would be ~40 GB, since
# sd.cpp widens fp8 to f16 on load.
#
# The text encoder is Qwen2.5-VL-7B: the edit models read the reference
# image through its vision tower, which a GGUF encoder keeps in a separate
# mmproj file (weights.parts.llm_vision).
#
# 2511 needs qwen_image_zero_cond_t at load; without it sd.cpp renders its
# edits markedly worse.
name: qwen-image-edit-2511
modalities: [image_edit]
engine: sd.cpp
weights:
  licence: apache-2.0
  parts:
    diffusion:
      path: diffusion_models/qwen-image-edit-2511-Q6_K.gguf
      source: hf:unsloth/Qwen-Image-Edit-2511-GGUF/qwen-image-edit-2511-Q6_K.gguf
      revision: 52838251db242ddd8e8d0118de36c71006d7c397
      licence: apache-2.0
    text_encoder:
      path: text_encoders/Qwen2.5-VL-7B-Instruct-Q8_0.gguf
      source: hf:unsloth/Qwen2.5-VL-7B-Instruct-GGUF/Qwen2.5-VL-7B-Instruct-Q8_0.gguf
      revision: 68bb8bc4b7df5289c143aaec0ab477a7d4051aab
      licence: apache-2.0
    llm_vision:
      path: text_encoders/Qwen2.5-VL-7B-Instruct-mmproj-F16.gguf
      source: hf:unsloth/Qwen2.5-VL-7B-Instruct-GGUF/mmproj-F16.gguf
      revision: 68bb8bc4b7df5289c143aaec0ab477a7d4051aab
      licence: apache-2.0
    vae:
      path: vae/qwen_image_vae.safetensors
      source: hf:Comfy-Org/Qwen-Image/split_files/vae/qwen_image_vae.safetensors
      revision: 1f12b17be14c89b026c51a91d67c32f84bb047bc
      licence: apache-2.0
    lora:
      path: loras/Qwen-Image-Edit-2511-Lightning-4steps-V1.0-bf16.safetensors
      source: hf:lightx2v/Qwen-Image-Edit-2511-Lightning/Qwen-Image-Edit-2511-Lightning-4steps-V1.0-bf16.safetensors
      revision: 107d238d68b8387e32843d0b4a2e24ceb0d3ad86
      licence: apache-2.0
    # Camera control, for the tasks that ask for it (`loras: ["camera"]`):
    # fal's multiple-angles LoRA, trained on Gaussian-splat renders of 96
    # camera poses. Its prompt is the pose, `<sks>` then an azimuth, an
    # elevation and a distance: "<sks> right side view eye-level shot
    # medium shot" (docs/api.md lists them).
    lora_camera:
      path: loras/qwen-image-edit-2511-multiple-angles-lora.safetensors
      source: hf:fal/Qwen-Image-Edit-2511-Multiple-Angles-LoRA/qwen-image-edit-2511-multiple-angles-lora.safetensors
      revision: e3066224ab74263f4a5b6179cd1a3b0a15577e44
      licence: apache-2.0
vram:
  # Measured on an RTX 5090, sd-server's own peak: 19,992 MiB for a 1 MP
  # edit (512x512 and 1 MP references alike), 20,920 MiB at 2016x1152 and
  # 1152x2016 with a 1 MP and a 2.3 MP reference. The Q6_K DiT staged on
  # the card dominates, so a 16 GB card never fits it.
  gb: 21.0
  measured: true
params:
  # Lightning is distilled for 4 steps without CFG.
  steps: 4
  cfg_scale: 1.0
  flow_shift: 3.0
  model_args: [qwen_image_zero_cond_t=true]
  lora_camera_strength: 0.9
  # 2.4 MP (2048x1152), inside the measured figure above.
  max_render_pixels: 2400000
max_batch: 2
