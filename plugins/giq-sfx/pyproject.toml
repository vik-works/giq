[project]
name = "giq-sfx"
version = "0.11.0"
description = "Text to sound effects for giq (MOSS-SoundEffect v2)"
license = "Apache-2.0"
license-files = ["LICENSES/*.txt"]
authors = [{ name = "vikworks UG (haftungsbeschränkt)" }]
requires-python = ">=3.11,<3.13"
dependencies = [
    "giq==0.11.0",
]

[project.entry-points."giq.plugins"]
giq-sfx = "giq_sfx:plugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/giq_sfx", "src/giq_sfx_child"]
