# faster-whisper on the batch path, distinct from the resident audio stack
# (whisper-large-v3). Loads by repository from the HF cache; a weights.path
# to a converted CTranslate2 directory would load that instead. Named after
# the weights; the bare size it was called before ADR-003 made names global
# stays an alias.
name: faster-whisper-large-v3
modalities: [stt]
aliases: [large-v3]
engine: faster-whisper
weights:
  source: hf:Systran/faster-whisper-large-v3
vram:
  gb: 3.0
  measured: false
