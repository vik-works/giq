[project]
name = "giq-vllm"
version = "0.6.1"
description = "vllm for giq: Hugging Face checkpoints, continuous batching, MTP speculation"
license = "Apache-2.0"
authors = [{ name = "vikworks UG (haftungsbeschränkt)" }]
requires-python = ">=3.11,<3.13"
dependencies = [
    "giq==0.6.1",
]

[project.entry-points."giq.plugins"]
giq-vllm = "giq_vllm:plugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/giq_vllm"]
