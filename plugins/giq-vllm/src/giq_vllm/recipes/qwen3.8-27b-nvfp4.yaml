# Qwen3.8-27B as NVIDIA quantised it (ModelOpt NVFP4 weights, some layers
# FP8), served by vllm for many requests at once: the batch recipe. The same
# model as qwen3.8-27b under llama.cpp.
#
# Measured on an RTX 5090 on batch extraction — a ~3.1k-token document in,
# ~490 tokens of schema-constrained JSON out, thinking off: 71 documents a
# minute, ~3,650 input and ~580 output tokens/s. 16 requests at once already
# saturate the card; 32 and 64 measured the same 65-71 a minute and only
# lengthened the queue (slowest 5%: 27 s at 16, ~140 s at 64). A larger
# max_num_batched_tokens bought nothing, and at 16k the step's activations
# ran the card out of memory under load: with a KV size in bytes vllm skips
# its memory profiling, so overhead_gb has to cover the step's peak.
# Speculation costs throughput here (MTP-1 -30%, MTP-2 -7% at 16 parallel);
# the interactive sibling has it.
#
# The cards' power limit barely matters to it: 72 documents a minute at
# 575 W, 67 at 400 W — 13% more documents per kWh for 7% fewer per minute.
#
# Not resident by default: vllm takes minutes to start, so an operator who
# wants it pins it rather than paying a cold start on some user's first
# request. A first start after a vllm upgrade compiles FlashInfer kernels
# for ~14 minutes, past ready_timeout: run `giq prepare vllm --recipe` first.
name: qwen3.8-27b-nvfp4
modalities: [llm]
engine: vllm
label: Qwen3.8 27B NVFP4
detail: "chat + vision · vllm · batch · 16 in parallel · 128k ctx"
weights:
  path: nvidia-Qwen3.8-27B-NVFP4
  source: hf:nvidia/Qwen3.8-27B-NVFP4
  revision: 482ca0f3832238542f8f5295dde86b5f22711d80
  format: modelopt
  licence: apache-2.0
capabilities: [chat, vision]
# No speculation, fp8 KV; 16 requests rather than the profile's 32, the
# measured saturation point on a 5090.
profile: throughput
params:
  max_num_seqs: 16
  # The budget is a KV size, not a fraction of the card, so it means the same
  # on a 32 GB RTX 5090 and a 96 GB RTX PRO 6000. 6 GiB of fp8 KV holds
  # about 180k tokens (36 KiB per token): one full 128k request and change,
  # or 16 requests averaging 11k — and keeps the whole recipe loadable on
  # a 32 GB card through giq's gate with its 2 GB margin. On a bigger card,
  # replace this file in the recipes directory with a larger budget (and a
  # vram figure to match) rather than a fraction.
  kv_cache_memory: 6G
  # 128k, not the native 256k: a full-length request must fit the pool.
  max_model_len: 131072
  kv_cache_dtype: fp8
  # Qwen3.x thinks between <think> tags; the parser moves the thought to its
  # own channel (giq relays it as reasoning_content). Tool calls come as
  # Qwen3-Coder's XML <function=…> blocks, which is what its chat template
  # asks for.
  reasoning_parser: qwen3
  tool_call_parser: qwen3_coder
# Sampling needs no defaults here: vllm applies the checkpoint's
# generation_config.json (Qwen's top_k 20, top_p 0.95) under each request.
vram:
  # Loaded weights (vllm's own figure; the MTP head is not loaded without
  # speculation) + the KV budget + everything else the process holds.
  weights_gb: 19.92
  overhead_gb: 3.5
  measured: false
max_batch: 32
