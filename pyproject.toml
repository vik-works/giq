[project]
name = "giq"
version = "0.6.0"
description = "GPU Inference Queue - efficient GPU worker management for multimodal AI"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "LICENSES/*.txt"]
authors = [{ name = "vikworks UG (haftungsbeschränkt)" }]
requires-python = ">=3.11,<3.13"
dependencies = [
    # The service: queue, scheduler, API, dashboard, recipes and weights.
    # Nothing a model needs: every engine and modality past llama.cpp comes
    # with a plugin (ADR-004), and `giq-defaults` installs the curated ones.
    # A checkout gets them all through the dev group.
    "fastapi>=0.141.1",
    "uvicorn>=0.40.0",
    "pydantic>=2.12.5",
    "httpx>=0.28.1",
    "pyyaml>=6.0.3",
    "python-multipart>=0.0.22",
    # Fetching a recipe's weights (ADR-005).
    "huggingface-hub>=1.30.0",
]

[project.urls]
Homepage = "https://vik.works"
Repository = "https://github.com/vik-works/giq"
Issues = "https://github.com/vik-works/giq/issues"

[project.scripts]
giq = "giq.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
# The dashboard is built from frontend/ (`make ui`) into this gitignored
# directory; hatch leaves ignored files out unless they are named here.
artifacts = ["src/giq/static/ui/**"]

[tool.hatch.build.targets.wheel]
packages = ["src/giq", "src/giq_child"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests", "plugins/*/src", "plugins/*/tests"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["giq", "giq_child", "giq_vllm", "giq_sdcpp", "giq_speech", "giq_ocr", "giq_depth"]

[tool.ruff.lint.per-file-ignores]
# FastAPI's `Depends()` / `File(...)` / `Form(...)` defaults look like B008
# violations but are the framework's intended dependency-injection idiom.
"src/giq/api/*" = ["B008"]
"plugins/*/src/*/api.py" = ["B008"]

[tool.ty.environment]
# ty moved this under [tool.ty.environment]; at the top level it now hard-fails
# the whole `make check` target rather than warning.
python-version = "3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Core's suite, and each curated plugin's under plugins/<name>/tests; the
# checkout's root is importable so a plugin's conftest can take core's
# isolation (tests/conftest.py).
testpaths = ["tests", "plugins"]
pythonpath = ["."]
asyncio_default_fixture_loop_scope = "function"

# The curated plugins are packages of this workspace (ADR-004 D7), released
# with core. Core's wheel depends on none of them; a checkout gets them all
# through the dev group below.
[tool.uv.workspace]
members = ["plugins/*"]

[tool.uv.sources]
giq = { workspace = true }
giq-vllm = { workspace = true }
giq-sdcpp = { workspace = true }
giq-speech = { workspace = true }
giq-ocr = { workspace = true }
giq-depth = { workspace = true }
giq-defaults = { workspace = true }

# uv installs this group by default, so `uv sync` gives a dev-ready checkout:
# core, every curated plugin, and the tools.
[dependency-groups]
dev = [
    "giq-defaults",
    "httpx>=0.28.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    # `make check`/`make fmt` used to fetch these ephemerally through `uv run`,
    # so a clean checkout could not lint or type-check offline.
    "ruff>=0.15.0",
    "ty>=0.0.74",
]
