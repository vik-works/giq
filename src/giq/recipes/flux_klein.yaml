# FLUX.2 klein 4B distilled (Apache-2.0), under sd.cpp. One recipe for both
# modalities: klein does kontext-style reference edits through the same
# sd-server (an edit is a txt2img call with extra_images), so renders and
# edits share one process and alternating between them costs no reload.
#
# Image files are single safetensors, one subfolder per part
# (diffusion_models/, text_encoders/, vae/, loras/) under GIQ_MODELS_DIR.
#
# The VAE: the klein 4B repack ships the FLUX.2 VAE under klein's
# Apache-2.0 licence. The same VAE sits in the FLUX.2 [dev] repository,
# whose card is non-commercial, so it is taken from klein for commercial use.
#
# Image figures plus the gate's margin must stay under a 16 GB card's
# 15.93 GB, or these models can never load there.
name: flux_klein
modalities: [text2image, image_edit]
engine: sd.cpp
weights:
  licence: apache-2.0
  parts:
    diffusion:
      path: diffusion_models/flux-2-klein-4b.safetensors
      source: hf:black-forest-labs/FLUX.2-klein-4B/flux-2-klein-4b.safetensors
      revision: e7b7dc27f91deacad38e78976d1f2b499d76a294
      licence: apache-2.0
    # Qwen3-4B, byte for byte the encoder z-image uses: one file for both.
    text_encoder:
      path: text_encoders/qwen_3_4b.safetensors
      source: hf:Comfy-Org/z_image_turbo/split_files/text_encoders/qwen_3_4b.safetensors
      revision: 6fc90a3b1b653e935a0d175e260736de25b84df5
      licence: apache-2.0
    vae:
      path: vae/flux2-vae.safetensors
      source: hf:Comfy-Org/vae-text-encorder-for-flux-klein-4b/split_files/vae/flux2-vae.safetensors
      revision: 5f526678002e43af5551dadb73ce2e8c91b43afe
      licence: apache-2.0
vram:
  # sd.cpp with --offload-to-cpu: sd-server's own peak is 7.91 GB, sampled
  # per process through a live render (a whole-card reading says ~8.5, which
  # counts more than the process's own). Declared 8.0 so the eviction planner
  # sees a deficit the resident LLM alone can cover — at 9.0 it falls
  # through to evicting the audio residents too whenever free VRAM dips under
  # ~2 GB. The figure is engine-specific: without CPU offload the same weights
  # need about 13 GB (7.75 diffusion bf16 + 3.85 Qwen3-4B TE + 0.3 VAE +
  # activations).
  gb: 8.0
  measured: true
# An edit carries a reference image a render does not; half the batch keeps
# the pair inside the same VRAM figure.
max_batch:
  text2image: 8
  image_edit: 4
