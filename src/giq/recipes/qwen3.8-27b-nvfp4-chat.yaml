# The same NVFP4 checkpoint as qwen3.8-27b-nvfp4, tuned for one request
# finishing as fast as possible rather than for many at once. Speculative
# decoding drafts with the checkpoint's own multi-token-prediction head.
#
# Measured on an RTX 5090 on single-session extraction — a ~3.1k-token
# document in, ~500 tokens of schema-constrained JSON out: 69 tok/s without
# speculation, 108 with one draft token, 138 with two, 162 with three
# (3.1 s a document). llama.cpp over the Q6_K GGUF of the same model, a file
# of the same size, measured 52 / 72 / 82 / 89 under the same load; the gap
# is the engine. JSON drafts well; free-form chat accepted 0.66, 0.37 and
# 0.17 by draft position on the same card, so for chat the third draft
# buys little, and the interactive profile keeps two. The power limit made
# no difference: one request drew ~410 W at any limit from 400 to 575 W.
#
# Under load speculation costs throughput (MTP-2 -7% at 16 parallel), which
# is why batch work goes to the sibling. Two recipes over one checkpoint
# share the card: asking for one evicts the other through the ordinary
# swap. Not resident by default, like its sibling.
name: qwen3.8-27b-nvfp4-chat
modalities: [llm]
engine: vllm
label: Qwen3.8 27B NVFP4 (interactive)
detail: "chat + vision · vllm · MTP · fastest single request · 128k ctx"
weights:
  path: nvidia-Qwen3.8-27B-NVFP4
  source: hf:nvidia/Qwen3.8-27B-NVFP4
  revision: 482ca0f3832238542f8f5295dde86b5f22711d80
  format: modelopt
  licence: apache-2.0
capabilities: [chat, vision]
# Up to 4 requests from the interactive profile; three draft tokens rather
# than its two (see above), and half its scheduling budget.
profile: interactive
params:
  speculative: {method: mtp, tokens: 3}
  # 4096 tokens a step, not the profile's 8192. With a KV size in bytes vllm
  # skips its memory profiling, so nothing checks that a step's activations
  # fit beside the weights and the KV pool — and on a 32 GB card they do not:
  # three agents reading their tool results at once ran the engine out of
  # memory at 8192 (31.2 of 31.8 GiB, then a dead engine). At 4096 the same
  # three ran to 40k tokens of history each (peak 30.7 GiB), and one agent's
  # time to first token and decode rate were unchanged up to 60k.
  max_num_batched_tokens: 4096
  # Half a gigabyte less KV than the batch recipe: the MTP head's weights
  # come out of the same card. Three drafts need 5.03 GiB to hold one full
  # 128k request, so 5 GiB refuses to start; 5.5 is ~160k tokens.
  kv_cache_memory: 5632M
  max_model_len: 131072
  kv_cache_dtype: fp8
  reasoning_parser: qwen3
  tool_call_parser: qwen3_coder
vram:
  # Loaded weights including the MTP head, + KV budget + overhead.
  weights_gb: 20.73
  overhead_gb: 3.5
  measured: false
max_batch: 32
