# baidu/Unlimited-OCR, 3B bf16, from a local snapshot pinned to the revision
# whose remote code was reviewed. The remote code was written against
# transformers 4.57; giq's child adapts it to giq's own transformers (see
# giq.adapters._ocr_child), with output identical to 4.57's. The snapshot
# holds the weights, tokenizer and the remote code, loaded by path with the
# hub disabled; GIQ_OCR_MODEL_DIR overrides the path.
name: unlimited-ocr
label: Unlimited-OCR
modalities: [ocr]
engine: transformers
detail: "PDF / page images → layout-tagged text · 32k ctx · dozens of pages per pass"
weights:
  path: baidu-Unlimited-OCR
  source: hf:baidu/Unlimited-OCR
  revision: 07dea832e22aefee32ad281d4b80551282e1c168
  format: safetensors
vram:
  # 6.3 GiB idle after load, 8266 MiB per-process peak through a 4-page pass
  # at 1024px, ~80 tok/s. Declared as an upper bound.
  gb: 9.0
  measured: true
  measured_on: NVIDIA GeForce RTX 5090
max_batch: 4
