# The resident audio stack: faster-whisper ASR + pyannote diarization, in
# child processes on giq's own venv. Both load by repository from the HF
# cache (GIQ_AUDIO_WHISPER_MODEL and GIQ_AUDIO_DIAR_MODEL override them). The
# diarization pipeline is pinned on purpose: it is not the
# speaker-diarization-3.1 one would assume, and changing it changes speaker
# attribution. The ASR snapshot is the one stt/large-v3 loads too.
name: whisper-large-v3
modalities: [audio]
engine: faster-whisper+pyannote
detail: "transcribe + diarize"
weights:
  parts:
    asr: {source: "hf:Systran/faster-whisper-large-v3"}
    diarization: {source: "hf:pyannote/speaker-diarization-community-1"}
vram:
  # whisper fp16 + pyannote ≈ 3.9 GB measured.
  gb: 4.0
  measured: true
